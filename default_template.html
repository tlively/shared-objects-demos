<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wasm GC Demo</title>
    <style>
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --primary: #2f81f7;
        --console-bg: #010409;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 30px 20px;
        display: flex;
        justify-content: center;
      }
      .container {
        max-width: 800px;
        width: 100%;
      }
      header {
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }
      h1 { margin: 0 0 8px 0; font-size: 1.8rem; }
      p.subtitle { margin: 0; color: var(--text-muted); line-height: 1.5; }
      .console-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .console-header {
        background: #21262d;
        padding: 10px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      pre#console-log {
        margin: 0;
        padding: 16px;
        background: var(--console-bg);
        color: #7ee787;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.9rem;
        line-height: 1.6;
        min-height: 200px;
        max-height: 480px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 id="demo-title">Shared Wasm GC Demo</h1>
        <p class="subtitle">Multi-threaded WebAssembly execution with shared objects and atomic synchronization.</p>
      </header>

      <div class="console-card">
        <div class="console-header">
          <span>Console Output</span>
          <span style="font-size: 0.75rem;">Status: Running</span>
        </div>
        <pre id="console-log"></pre>
      </div>
    </div>

    <script type="text/javascript">
      var consoleElem = document.getElementById('console-log');
      var Module = {
        print: function(text) {
          console.log(text);
          if (consoleElem) {
            consoleElem.textContent += text + '\n';
            consoleElem.scrollTop = consoleElem.scrollHeight;
          }
        },
        printErr: function(text) {
          console.error(text);
          if (consoleElem) {
            consoleElem.textContent += '[error] ' + text + '\n';
          }
        }
      };
    </script>
    <script async type="text/javascript" src="runtime.js"></script>
  </body>
</html>
